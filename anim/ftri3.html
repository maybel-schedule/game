function beep(f,d){try{const A=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}
const COL=['#ff9a5c','#5ab4ff','#8fd36a','#c58aff'];
function vBars(v){const rows=v.rows.map((r,i)=>{const [n,d,lab,k]=r;const parts=d*(k||1);const fill=n*(k||1);let h='';for(let j=0;j<parts;j++)h+='<i class="'+(j%(k||1)===0?'big':'')+'" style="background:'+(j<fill?(r[4]||COL[i%4]):'#fff')+'"></i>';return '<div class="bar pop" style="animation-delay:'+(i*.15)+'s"><b>'+fr(lab||('{'+n+'/'+d+'}'))+'</b><div class="row">'+h+'</div></div>'}).join('');return '<div class="bars">'+rows+'</div>'+(v.cap?'<div class="eq pop" style="font-size:clamp(20px,3.6vw,38px)">'+fr(v.cap)+'</div>':'')}
function pie(n,d,col){const R=90,c=100;let s='<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="#ffe7b0" stroke="#b86a12" stroke-width="6"/>';for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;const x0=c+R*Math.cos(a0),y0=c+R*Math.sin(a0),x1=c+R*Math.cos(a1),y1=c+R*Math.sin(a1);s+=(d===1?'<circle cx="100" cy="100" r="90" fill="'+(i<n?col:'#fff7e0')+'" stroke="#b86a12" stroke-width="2"/>':'<path d="M100 100 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A90 90 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'Z" fill="'+(i<n?col:'#fff7e0')+'" stroke="#b86a12" stroke-width="2"/>')}return s+'</svg>'}
function vPizza(v){return '<div class="pz">'+v.p.map((x,i)=>(i?'<span class="op">'+(v.op||'＋')+'</span>':'')+'<div class="pop" style="text-align:center;animation-delay:'+(i*.2)+'s">'+pie(x[0],x[1],x[2]||COL[i])+'<div class="eq" style="font-size:clamp(20px,3.4vw,34px)">'+fr('{'+x[0]+'/'+x[1]+'}')+'</div></div>').join('')+'</div>'+(v.cap?'<div class="eq pop" style="font-size:clamp(20px,3.6vw,38px)">'+fr(v.cap)+'</div>':'')}
function vLine(v){const W=900,x0=30,y=86;let s='<svg viewBox="0 0 960 185">';let acc=0;const tot=v.total;v.parts.forEach((p,i)=>{const w=p[0]/tot*W;s+='<rect x="'+(x0+acc).toFixed(1)+'" y="'+(y-22)+'" width="'+w.toFixed(1)+'" height="44" fill="'+(p[2]||COL[i%4])+'" stroke="#5a3a10" stroke-width="3" rx="4"/><text x="'+(x0+acc+w/2).toFixed(1)+'" y="'+(y+70)+'" text-anchor="middle" font-size="28" font-weight="900" fill="#5a3a10">'+p[1]+'</text>';acc+=w});s+='<path d="M'+x0+' 50 v-10 h'+W+' v10" stroke="#2a1a10" stroke-width="3" fill="none"/><text x="'+(x0+W/2)+'" y="30" text-anchor="middle" font-size="22" font-weight="900" fill="#2a1a10">'+(v.lab||'')+'</text></svg>';return '<div class="ln pop">'+s+'</div>'+(v.cap?'<div class="eq pop" style="font-size:clamp(20px,3.6vw,38px)">'+fr(v.cap)+'</div>':'')}
function vMult(v){return '<div class="mt pop">'+v.a.map(a=>'<div><b style="width:5em">'+a+' 的倍數</b>'+Array.from({length:v.n||8},(_,i)=>'<span class="'+(v.c&&v.c.includes(a*(i+1))?'c':'')+'">'+a*(i+1)+'</span>').join('')+'</div>').join('')+'</div>'+(v.cap?'<div class="eq pop" style="font-size:clamp(20px,3.6vw,38px)">'+fr(v.cap)+'</div>':'')}
function render(v){if(!v)return;const el=$('#vis');if(v.v==='title')el.innerHTML='<div class="ttl pop"><b>'+fr(v.t)+'</b><span>'+fr(v.s||'')+'</span></div>';else if(v.v==='eq')el.innerHTML='<div class="eq pop">'+fr(v.t)+'</div>'+(v.s?'<div class="eq pop" style="font-size:clamp(18px,3vw,30px);color:#7a5a30">'+fr(v.s)+'</div>':'');else if(v.v==='bars')el.innerHTML=vBars(v);else if(v.v==='pizza')el.innerHTML=vPizza(v);else if(v.v==='line')el.innerHTML=vLine(v);else if(v.v==='mult')el.innerHTML=vMult(v);else if(v.v==='svg')el.innerHTML='<div class="pop" style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:min(560px,92%)">'+v.svg.replace('<svg ','<svg style="width:100%;height:auto" ')+'</div>'+(v.cap?'<div class="eq" style="font-size:clamp(18px,3vw,28px)">'+fr(v.cap)+'</div>':'')+'</div>'}
let i=0,lastV=null,total=0,correct=0,nAns=0,fast=0,busy=false,auto=true,paused=false,away=0,awaySec=0,awT=0,rew=0;const done=new Set();
function visAt(k){for(let j=k;j>=0;j--)if(S[j].v)return S[j].v;return null}
function show(){const st=S[i];const v=visAt(i);if(v!==lastV){render(v);lastV=v}$('#pr').style.width=(i/(S.length-1)*100)+'%';
  if(st.q&&!done.has(i)){quiz(st);return}
  const who=st.w==='s'?SIDEI:HOSTI;$('#who').src=who;$('#tx').innerHTML='<span class="nm">'+(st.w==='s'?'分分':'通通')+'</span>'+fr(st.t||'')+(st.warn?'<div class="warnx">⚠️ 容易錯</div>':'');speak(st.t||'',()=>{if(auto&&!busy&&!paused&&!document.querySelector('.fstar'))next()});if(i%5===3&&!done.has('f'+i))fstar()}
let miss=0;function fstar(){const k=i;done.add('f'+k);const b=document.createElement('button');b.type='button';b.className='fstar';b.textContent='⭐ 點我！';b.style.left=(10+Math.random()*70)+'%';b.style.top=(12+Math.random()*45)+'%';$('#st').appendChild(b);const t=setTimeout(()=>{if(!b.isConnected)return;b.remove();if(paused)return;miss++;i=Math.max(0,i-1);lastV=null;const m=document.createElement('div');m.className='awm';m.innerHTML='😴 星星沒被點到，倒退一句再聽一次！';$('#st').appendChild(m);setTimeout(()=>{m.remove();show()},1800)},7000);b.onclick=e=>{e.stopPropagation();clearTimeout(t);b.remove();beep(990,.15);if(!busy&&!paused&&auto)setTimeout(next,400)}}
function quiz(st){busy=true;const qs=st.q;let k=0,t0=Date.now(),first=true;const cp=document.createElement('div');cp.className='cp';$('#st').appendChild(cp);speechSynthesis&&speechSynthesis.cancel();
  const draw=()=>{const Q=qs[k%qs.length];const ord=Q[1].map((o,j)=>[o,j]).sort(()=>Math.random()-.5);cp.innerHTML='<div class="box"><h3>🤔 想一想</h3><p>'+fr(Q[0])+'</p><div class="os">'+ord.map(([o,j])=>'<button type="button" data-j="'+j+'">'+fr(o)+'</button>').join('')+'</div><div class="fb" id="fb"></div></div>';speak(Q[0]);t0=Date.now();
    cp.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();const ok=+b.dataset.j===0;nAns++;if(Date.now()-t0<2000)fast++;if(first){total++;if(ok)correct++}
      if(ok){b.classList.add('good');beep(880,.25);cp.querySelector('#fb').innerHTML='✅ 答對了！'+fr(Q[2]||'');cp.querySelector('#fb').style.color='#2f9a5d';speak('答對了！'+(Q[2]||''));setTimeout(()=>{cp.remove();busy=false;done.add(i);next()},Q[2]?2600:1100)}
      else{b.classList.add('bad');beep(220,.3);first=false;cp.querySelector('#fb').innerHTML='❌ 再想想！換一題類似的…';cp.querySelector('#fb').style.color='#c0392b';setTimeout(()=>{k++;draw()},1300)}})};draw()}
function next(){if(busy)return;if(i<S.length-1){i++;show()}else finish()}
function finish(){busy=true;speechSynthesis&&speechSynthesis.cancel();const e=document.createElement('div');e.className='end';e.innerHTML='<b>🎉 看完了！</b><div style="font-size:20px;font-weight:700">想一想答對 '+correct+' / '+total+' 題</div><div style="color:#7a5a30">關掉動畫，就可以去讀課本重點囉！</div>';$('#st').appendChild(e);beep(660,.2);setTimeout(()=>beep(990,.3),220);
  try{parent.postMessage({type:'vn-done',key:VN_KEY,sec:VN_SEC,total,correct,n:nAns,fast,away,awaySec,miss,chk:total,play:1},'*')}catch(x){}}
$('#st').onclick=()=>{if(paused){setP(false);return}spTok++;next()};$('#nx').onclick=()=>{spTok++;next()};$('#back').onclick=()=>{if(busy)return;if(i>0){i--;show()}};
$('#vo').onclick=()=>{voOn=!voOn;try{localStorage.setItem('mvn-vo',voOn?'1':'0')}catch(e){}$('#vo').textContent='🔊 配音：'+(voOn?'開':'關');if(!voOn)speechSynthesis.cancel()};$('#vo').textContent='🔊 配音：'+(voOn?'開':'關');
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next()}});
const setP=v=>{paused=v;$('#ap').textContent=v?'▶ 繼續播放':'⏸ 暫停';if(v){spTok++;try{speechSynthesis.cancel()}catch(e){}}else if(!busy)show()};$('#ap').onclick=()=>setP(!paused);
/* 🕵️ 不專心偵測：切到別的分頁、別的視窗（雙開螢幕）就暫停，回來時倒退兩句重看 */
const leave=()=>{if(awT||document.querySelector('.end'))return;awT=Date.now();away++;setP(true)};
const back2=()=>{if(!awT)return;const sec=Math.round((Date.now()-awT)/1000);awT=0;awaySec+=sec;if(sec<2||busy){setP(false);return}rew++;i=Math.max(0,i-2);while(i>0&&S[i].q)i--;lastV=null;const m=document.createElement('div');m.className='awm';m.innerHTML='👀 剛剛離開了 '+sec+' 秒，影片倒退兩句，再看一次喔！<br><small>看動畫時不要切換分頁或開別的視窗</small>';$('#st').appendChild(m);setTimeout(()=>{m.remove();setP(false)},2600)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)leave();else back2()});window.addEventListener('blur',leave);window.addEventListener('focus',back2);
window.addEventListener('message',ev=>{const d=ev.data||{};if(d.type!=='vn-again')return;const e=document.querySelector('.end');if(!e)return;const r=document.createElement('div');r.style.cssText='font-size:16px;font-weight:700;color:#5a3a10;background:#fff6dc;border-radius:12px;padding:8px 14px;max-width:560px';r.innerHTML=(d.reward||'')+(d.why?'<br>'+d.why:'')+(d.ok?'<br>💡 想刷更好的裝備？再專心看一次、答對更多題就有機會！':'');e.appendChild(r);if(d.ok){const b=document.createElement('button');b.type='button';b.textContent=d.lab||'🔁 再看一次';b.style.cssText='font:inherit;font-size:18px;font-weight:900;padding:8px 22px;border-radius:14px;border:0;background:#ffb84a;color:#4a2a00;cursor:pointer';b.onclick=x=>{x.stopPropagation();e.remove();i=0;done.clear();total=correct=nAns=fast=away=awaySec=rew=miss=0;busy=false;lastV=null;show()};e.appendChild(b)}});
(function(){const g=document.createElement('div');g.className='awm gate';g.innerHTML='<div style="font-size:54px">▶</div>點一下開始播放<br><small>動畫會自動播放、邊播邊抽問；中途切換分頁或視窗會暫停並倒退喔！</small>';$('#st').appendChild(g);g.onclick=e=>{e.stopPropagation();g.remove();try{speechSynthesis.getVoices();window.focus()}catch(_){}show()}})();
</script></body></html>
