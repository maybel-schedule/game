<script>
(()=>{
const W=1280,H=720;
const FONT='"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const INK='#24324a',HOT='#ef5a3c',HOT2='#ff9a5a',COLD='#2f8be6',COLD2='#8cc8ff',GREEN='#3fae6a',YEL='#ffc93c',COPPER='#c87533';
const SECBG={0:'#eef1ff',1:'#eaf2ff',2:'#fff3e8',3:'#eaf8f1'};
const SECCOL={1:'#2f6fd6',2:'#e0662b',3:'#1f9d6b'};
const SECNAME={1:'4-1 地球像個大磁鐵',2:'4-2 認識電磁鐵',3:'4-3 生活中電磁鐵的應用'};

let GT=0;
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d');
const params=new URLSearchParams(location.search);
const SCALE=parseFloat(params.get('scale')||'1.5');
cv.width=Math.round(W*SCALE); cv.height=Math.round(H*SCALE);

/* ---------- math helpers ---------- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const es=(t,a,b)=>ease(seg(t,a,b));
const frac=x=>x-Math.floor(x);
const tri=u=>{u=((u%2)+2)%2;return u>1?2-u:u};
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const [a,va]=keys[i],[b,vb]=keys[i+1];
    if(t<b)return lerp(va,vb,ease((t-a)/(b-a)));
  }
  return keys[keys.length-1][1];
}
function pop(t,t0,d=0.5){
  const k=clamp((t-t0)/d,0,1); if(k<=0)return 0;
  const c=1.70158,u=k-1; return 1+(c+1)*u*u*u+c*u*u;
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(1234); const RND=Array.from({length:1200},()=>R());
function mixHex(a,b,k){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(lerp(pa>>16,pb>>16,k)),g=Math.round(lerp(pa>>8&255,pb>>8&255,k)),bl=Math.round(lerp(pa&255,pb&255,k));
  return `rgb(${r},${g},${bl})`;
}

/* ---------- drawing helpers ---------- */
function P(){ctx.beginPath()}
function fillStroke(fill,stroke,lw){if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw||3;ctx.strokeStyle=stroke;ctx.stroke()}}
function circle(x,y,r,fill,stroke,lw){P();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);fillStroke(fill,stroke,lw)}
function ellipse(x,y,rx,ry,fill,stroke,lw,a0=0,a1=Math.PI*2){P();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,a0,a1);fillStroke(fill,stroke,lw)}
function rect(x,y,w,h,r,fill,stroke,lw){P();ctx.roundRect(x,y,w,h,r);fillStroke(fill,stroke,lw)}
function line(x1,y1,x2,y2,color,lw=3){P();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()}
function text(s,x,y,size,color,o={}){
  ctx.font=`${o.w||700} ${size}px ${FONT}`;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.sw||8;ctx.strokeStyle=o.stroke;ctx.strokeText(s,x,y)}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function alpha(a,fn){if(a<=0.001)return;ctx.save();ctx.globalAlpha*=clamp(a,0,1);fn();ctx.restore()}
function at(x,y,s,fn){if(s<=0.001)return;ctx.save();ctx.translate(x,y);ctx.scale(s,s);fn();ctx.restore()}
function arrow(x1,y1,x2,y2,color,lw=6,head=18){
  const a=Math.atan2(y2-y1,x2-x1);
  line(x1,y1,x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6,color,lw);
  P();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-0.45)*head,y2-Math.sin(a-0.45)*head);ctx.lineTo(x2-Math.cos(a+0.45)*head,y2-Math.sin(a+0.45)*head);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function curveArrow(pts,color,lw=6){ // quadratic through 3 points
  const [a,b,c]=pts;P();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(b[0],b[1],c[0],c[1]);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
  const ang=Math.atan2(c[1]-b[1],c[0]-b[0]),h=lw*3;
  P();ctx.moveTo(c[0]+Math.cos(ang)*h*0.5,c[1]+Math.sin(ang)*h*0.5);ctx.lineTo(c[0]-Math.cos(ang-0.5)*h,c[1]-Math.sin(ang-0.5)*h);ctx.lineTo(c[0]-Math.cos(ang+0.5)*h,c[1]-Math.sin(ang+0.5)*h);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function wavy(x1,y1,x2,y2,color,lw,amp,waves,phase){
  const len=Math.hypot(x2-x1,y2-y1),a=Math.atan2(y2-y1,x2-x1);
  ctx.save();ctx.translate(x1,y1);ctx.rotate(a);P();
  for(let i=0;i<=40;i++){const u=i/40;const yy=Math.sin(u*waves*Math.PI*2+phase)*amp;i?ctx.lineTo(u*len,yy):ctx.moveTo(0,yy)}
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();ctx.restore();
}
function dropPath(w,h){ctx.moveTo(0,-h);ctx.bezierCurveTo(w*0.9,-h*0.35,w,w*0.9,0,w);ctx.bezierCurveTo(-w,w*0.9,-w*0.9,-h*0.35,0,-h)}
function flame(x,y,s,t){
  const f=1+Math.sin(t*19)*0.06+Math.sin(t*31+1)*0.04;
  at(x,y,s,()=>{
    ctx.save();ctx.scale(1,f);
    P();dropPath(22,58);ctx.fillStyle='#ff7a2f';ctx.fill();
    P();ctx.translate(0,6);dropPath(14,38);ctx.fillStyle='#ffc93c';ctx.fill();
    P();ctx.translate(0,6);dropPath(7,18);ctx.fillStyle='#fff3b0';ctx.fill();
    ctx.restore();
  });
}
function steam(x,y,t,n=3,col='rgba(255,255,255,.85)',spread=40,hgt=70){
  for(let i=0;i<n;i++){
    const p=frac(t*0.5+i/n);const xx=x+(i-(n-1)/2)*spread;
    alpha(Math.sin(p*Math.PI),()=>{P();for(let k=0;k<=12;k++){const u=k/12;const yy=y-p*30-u*hgt;const xo=Math.sin(u*6+t*3+i)*6;k?ctx.lineTo(xx+xo,yy):ctx.moveTo(xx+xo,yy)}ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke()});
  }
}
function sun(x,y,r,t){
  ctx.save();ctx.translate(x,y);ctx.rotate(t*0.3);
  for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);line(r+10,0,r+30+Math.sin(t*3+i)*5,0,'#ffb627',7)}
  ctx.restore();circle(x,y,r,'#ffd23f','#ffb627',5);
}
function thermo(x,y,h,level,o={}){ // y = bulb center, level 0..1
  const col=o.col||HOT;
  rect(x-11,y-h,22,h,11,'#fff',INK,3);
  const lh=(h-18)*clamp(level,0,1);
  rect(x-5,y-lh-8,10,lh+8,5,col);
  circle(x,y,18,col,INK,3);
  for(let i=1;i<6;i++)line(x+11,y-18-i*(h-30)/6,x+18,y-18-i*(h-30)/6,INK,2);
}
function tubBack(x,y,w,h){rect(x-w/2,y,w,h,14,'rgba(255,255,255,.7)')}

const BAND=['#ef5a3c','#ffb627','#3fae6a','#2f8be6','#7b6cf6'];
function bands(p,fromLeft){ // p 0..1 coverage
  const bh=H/5;for(let i=0;i<5;i++){const q=ease(clamp(p*1.35-i*0.07,0,1));
    ctx.fillStyle=BAND[i];P();
    if(fromLeft){const r=lerp(-80,W+80,q);ctx.roundRect(-100,i*bh-1,r+100,bh+2,[0,bh/2,bh/2,0])}
    else{const l=lerp(-80,W+80,q);ctx.roundRect(l,i*bh-1,W+200-l,bh+2,[bh/2,0,0,bh/2])}
    ctx.fill()}
}
function iris(p,open){const r=open?lerp(0,900,ease(p)):lerp(900,0,ease(p));ctx.save();P();ctx.rect(0,0,W,H);ctx.arc(640,360,Math.max(0.1,r),0,Math.PI*2,true);ctx.fillStyle='#1d2550';ctx.fill();
  if(r>10){P();ctx.arc(640,360,r,0,Math.PI*2);ctx.strokeStyle='#ffd23f';ctx.lineWidth=10;ctx.stroke()}ctx.restore()}
function swipe(i,t,D){
  const mode=(k)=>k%2;
  if(t<0.6){if(mode(i)&&i>0)iris(seg(t,0,0.6),true);else bands(seg(t,0,0.6),false)}
  if(i<scenes.length-1&&t>D-0.45){if(mode(i+1))iris(seg(t,D-0.45,D),false);else bands(seg(t,D-0.45,D),true)}
}
function ambient(sc,T){
  const col=SECCOL[sc.sec]||'#ffb627';
  for(let k=0;k<14;k++){const o=RND[k+360];const sp=12+o*18;const y=H+60-frac(T*sp/800+o)*(H+120);const x=RND[k+370]*W+Math.sin(T*0.6+k)*30;
    alpha(0.08+0.06*RND[k+380],()=>{if(k%3==0){ctx.save();ctx.translate(x,y);ctx.rotate(T*0.5+k);star(0,0,14+o*16,col);ctx.restore()}else circle(x,y,10+o*26,col)})}
}
function star(x,y,r,col){P();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=col;ctx.fill()}
function burst(x,y,u){

    circle(x,y,20+k*120,null,'rgba(255,210,63,.9)',6*(1-k))});

function confetti(x,y,u,seed){
  if(u<0||u>2.6)return;
  for(let i=0;i<70;i++){const r1=RND[(i*3+Math.floor(seed*7))%400],r2=RND[(i*7+11)%400],r3=RND[(i*5+3)%400];
    const a=-Math.PI/2+(r1-0.5)*2.6;const v=380+r2*420;
    const px=x+Math.cos(a)*v*u*0.9+Math.sin(u*5+i)*18;const py=y+Math.sin(a)*v*u+520*u*u;

    alpha(Math.min(1,(2.6-u)/0.6),()=>{ctx.save();ctx.translate(px,py);ctx.rotate(u*8*(r3-0.5)*3+i);ctx.scale(1,Math.cos(u*10+i));ctx.fillStyle=BAND[i%5];ctx.fillRect(-7,-4,14,8);ctx.restore()})}
